name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    if: false
    runs-on: macos-15
    env:
      BUNDLE: build/openBassSpace_artefacts/Release/VST3/openBassSpace.vst3
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DAMS_BUILD_HOST_CHECKS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Sign ad hoc
        run: codesign --force --deep --sign - "$BUNDLE"

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "$BUNDLE"

      - name: Package
        run: |
          mkdir -p dist
          ditto "$BUNDLE" "dist/$(basename "$BUNDLE")"
          python3 scripts/package_notices.py dist
          ditto -c -k dist openBassSpace-VST3-macOS.zip
          cp openBassSpace-VST3-macOS.zip openMaster-VST3-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: openBassSpace-VST3-macOS
          path: |
            openBassSpace-VST3-macOS.zip
            openMaster-VST3-macOS.zip

  windows:
    runs-on: windows-latest
    env:
      BUNDLE: build/openBassSpace_artefacts/Release/VST3/openBassSpace.vst3
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DAMS_BUILD_HOST_CHECKS=ON -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload preview screenshot
        uses: actions/upload-artifact@v4
        with:
          name: preview-screenshot
          path: build/screenshots/native-ui.png
          if-no-files-found: error

      - name: Validate with pluginval
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --validate "$env:BUNDLE"

      - name: Package
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -Recurse "$env:BUNDLE" dist/
          python scripts/package_notices.py dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/* -DestinationPath openBassSpace-VST3-Windows.zip
          Copy-Item openBassSpace-VST3-Windows.zip openMaster-VST3-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: openBassSpace-VST3-Windows
          path: |
            openBassSpace-VST3-Windows.zip
            openMaster-VST3-Windows.zip

  release:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success' && (needs.macos.result == 'skipped' || needs.macos.result == 'success') }}
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Write release body
        env:
          TAG: ${{ github.ref_name }}
        run: |
          notes=$(python3 scripts/release_notes.py "$TAG")
          screenshot="![Native editor](https://raw.githubusercontent.com/alanmarcero/openBassSpace/${TAG}/docs/screenshots/preview.png)"
          {
            printf '%s\n\n' "$screenshot"
            if [ -n "$notes" ]; then
              printf '%s\n' "$notes"
            fi
          } > "$RUNNER_TEMP/release-body.md"
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            openBassSpace-VST3-*.zip
            openMaster-VST3-*.zip
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/release-body.md
          generate_release_notes: true

  update-preview:
    # Refreshes docs/screenshots/preview.png (the image OpenVST Manager shows) from a
    # factory-default editor capture whenever UI-affecting files change on main.
    # This job used to need the Windows build, so a Windows link failure skipped the
    # screenshot entirely. It now renders on Linux and does not wait on Windows.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect UI changes
        id: ui
        run: |
          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$before" "${{ github.sha }}" | grep -qE '^(Source|assets|Tools|tools|Tests)/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No UI changes; keeping preview."
          fi
      - name: Install GUI libraries
        if: steps.ui.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libasound2-dev libfontconfig1-dev libfreetype6-dev libgtk-3-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            xvfb
      - name: Build editor capture
        if: steps.ui.outputs.changed == 'true'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DOBS_BUILD_TESTS=OFF
          cmake --build build --target open_bass_space_capture --parallel
      - name: Render factory-default preview
        if: steps.ui.outputs.changed == 'true'
        run: |
          mkdir -p docs/screenshots
          xvfb-run -a ./build/open_bass_space_capture --preview docs/screenshots/preview.png
      - name: Commit refreshed preview if changed
        if: steps.ui.outputs.changed == 'true'
        run: |
          if git diff --quiet -- docs/screenshots/preview.png; then echo "Preview unchanged."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/preview.png
          git commit -m "docs: refresh preview screenshot [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
